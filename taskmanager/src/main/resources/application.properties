# ===========================================
# TaskManager Backend Configuration
# ===========================================

# Application
spring.application.name=${APP_NAME:TaskManager}
spring.profiles.active=${NODE_ENV:development}

# Database Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# Server Configuration - Railway uses PORT variable
server.port=${PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}

# Logging Configuration
logging.level.org.springframework=${LOG_LEVEL:INFO}
logging.level.com.chauhanpiyush.taskmanager=${LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE_PATH:logs/taskmanager.log}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:*}

# Security Configuration
bcrypt.rounds=${BCRYPT_ROUNDS:12}
session.timeout=${SESSION_TIMEOUT:3600000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Info
app.name=${APP_NAME:TaskManager}
app.version=${APP_VERSION:1.0.0}
app.description=${APP_DESCRIPTION:Professional Task Management System}

# Development/Production Settings
debug=${DEBUG:false}